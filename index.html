<!DOCTYPE html>
<html>

<head>
    <title>WONJUN KIM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1 class="name">
            <span>W</span>
            <span>O</span>
            <span>N</span>
            <span>J</span>
            <span>U</span>
            <span>N</span>
            <br>
            <span>K</span>
            <span>I</span>
            <span>M</span>
        </h1>

        <p class="subtitle">
            ACCOUNTING · FINANCE · ANALYSIS
        </p>


        <div class="buttons">

            <a href="about.html">
                <button>ABOUT</button>
            </a>

            <a href="journey.html">
                <button>JOURNEY</button>
            </a>

            <a href="projects.html">
                <button>PROJECTS</button>
            </a>

        </div>

    </div>


    <!-- 폭탄 버튼 -->
    <button class="bomb" id="bomb" title="Don't press me...">💣</button>

    <!-- 돈 내리는 버튼 -->
    <button class="money-btn" id="money" title="Make it rain!">💰</button>

    <!-- 폭발 이펙트 -->
    <div class="boom" id="boom">💥</div>

    <!-- 되돌리기 -->
    <button class="reset-btn" id="reset">PUT IT BACK 🔧</button>


    <script>
        const bomb  = document.getElementById("bomb");
        const boom  = document.getElementById("boom");
        const reset = document.getElementById("reset");

        // 날아갈 요소들: 이름 글자 + 문구 + 버튼
        const pieces = Array.from(document.querySelectorAll(
            ".name span, .subtitle, .buttons"
        ));

        // 원래 스타일 저장 (되돌릴 때 복원용)
        const origStyle = pieces.map((el) => el.getAttribute("style"));

        let exploded = false;
        let rafId = null;
        let parts = [];

        // 물리 상수
        const GRAVITY = 0.9;
        const FLOOR_BOUNCE = 0.62;   // 바닥에 튕길 때 남는 속도
        const WALL_BOUNCE  = 0.72;   // 벽에 튕길 때 남는 속도

        bomb.addEventListener("click", () => {
            if (exploded) return;
            exploded = true;

            // 심지 타들어가는 연출
            bomb.classList.add("lit");

            setTimeout(() => {
                bomb.classList.remove("lit");

                // 중앙에서 BOOM!
                boom.classList.add("show");

                // 각 조각을 현재 위치에 고정시키고 초기 속도 부여
                parts = pieces.map((el) => {
                    const rect = el.getBoundingClientRect();

                    el.style.position = "fixed";
                    el.style.left = "0";
                    el.style.top  = "0";
                    el.style.margin = "0";
                    el.style.animation = "none";
                    el.style.transition = "none";
                    el.style.opacity = "1";   // 애니메이션 끄면 기본 opacity가 0이라 사라짐 → 보이게 고정
                    el.style.zIndex = "14";

                    return {
                        el,
                        x: rect.left,
                        y: rect.top,
                        w: rect.width,
                        h: rect.height,
                        vx: (Math.random() - 0.5) * 38,        // 좌우로 팍
                        vy: -(Math.random() * 22 + 8),          // 위로 솟구쳤다가
                        angle: 0,
                        va: (Math.random() - 0.5) * 34          // 빙글빙글
                    };
                });

                startPhysics();

                // 되돌리기 버튼 등장
                setTimeout(() => reset.classList.add("show"), 800);
            }, 700);
        });

        function startPhysics() {
            const W = window.innerWidth;
            const H = window.innerHeight;

            function step() {
                parts.forEach((p) => {
                    p.vy += GRAVITY;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.angle += p.va;

                    // 좌우 벽
                    if (p.x < 0) { p.x = 0; p.vx = -p.vx * WALL_BOUNCE; p.va *= 0.9; }
                    if (p.x > W - p.w) { p.x = W - p.w; p.vx = -p.vx * WALL_BOUNCE; p.va *= 0.9; }

                    // 천장
                    if (p.y < 0) { p.y = 0; p.vy = -p.vy * WALL_BOUNCE; }

                    // 바닥 (튕기고 서서히 멈춤)
                    if (p.y > H - p.h) {
                        p.y = H - p.h;
                        p.vy = -p.vy * FLOOR_BOUNCE;
                        p.vx *= 0.9;      // 바닥 마찰
                        p.va *= 0.8;
                    }

                    p.el.style.transform =
                        `translate(${p.x}px, ${p.y}px) rotate(${p.angle}deg)`;
                });

                rafId = requestAnimationFrame(step);
            }

            step();
        }

        // ===== 돈 내리기 =====
        const money = document.getElementById("money");
        const bills = ["💵", "💴", "💶", "💷", "💰", "🤑"];

        money.addEventListener("click", () => {
            // 한 번 누르면 40장 정도 우수수
            for (let i = 0; i < 40; i++) {
                const cash = document.createElement("div");
                cash.className = "cash";
                cash.textContent = bills[i % bills.length];

                cash.style.left = Math.random() * 100 + "vw";
                cash.style.fontSize = (24 + Math.random() * 24) + "px";
                cash.style.animationDuration = (2 + Math.random() * 2) + "s";
                cash.style.animationDelay = (Math.random() * 0.8) + "s";

                document.body.appendChild(cash);

                // 다 떨어지면 제거
                cash.addEventListener("animationend", () => cash.remove());
            }
        });


        // 다시 원래대로 (글자들이 다시 위에서 뚝뚝 떨어짐)
        reset.addEventListener("click", () => {
            if (!exploded) return;

            boom.classList.remove("show");
            reset.classList.remove("show");

            // 물리 루프 정지
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
            parts = [];

            // 원래 스타일로 복원 → CSS의 drop 애니메이션이 다시 재생됨
            pieces.forEach((el, i) => {
                if (origStyle[i] === null) {
                    el.removeAttribute("style");
                } else {
                    el.setAttribute("style", origStyle[i]);
                }
            });

            exploded = false;
        });
    </script>


</body>
<div class="background"></div>
</html>
