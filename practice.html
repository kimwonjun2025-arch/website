                { en: "Bland",        ko: "싱거운 / 밍밍한",    ex: "\"The soup tastes a little bland.\"" },
                { en: "Chewy",        ko: "쫄깃한",            ex: "\"These noodles are nice and chewy.\"" },
                { en: "Greasy",       ko: "기름진",            ex: "\"That fried food is too greasy for me.\"" }
            ]
        };

        const flashcard = document.getElementById("flashcard");
        const cardEn = document.getElementById("cardEn");
        const cardKo = document.getElementById("cardKo");
        const cardEx = document.getElementById("cardEx");
        const counter = document.getElementById("counter");
        const totalEl = document.getElementById("total");
        const countArea = document.getElementById("countArea");
        const quizMsg = document.getElementById("quizMsg");
        const studyControls = document.getElementById("studyControls");
        const quizControls = document.getElementById("quizControls");
        const deckTabs = document.querySelectorAll("#deckTabs .deck-tab");
        const modeTabs = document.querySelectorAll("#modeTabs .deck-tab");

        let deckKey = "phrases";
        let cards = decks[deckKey];
        let mode = "study";     // study | quiz
        let idx = 0;            // study 위치
        let queue = [];         // quiz 대기열 (카드 인덱스)

        // 발음
        function speak(text) {
            if (!("speechSynthesis" in window)) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "en-US";
            u.rate = 0.95;
            speechSynthesis.cancel();
            speechSynthesis.speak(u);
        }

        // 현재 보여줄 카드 인덱스
        function currentCardIndex() {
            return mode === "quiz" ? queue[0] : idx;
        }

        function fillCard(c) {
            cardEn.textContent = c.en;
            cardKo.textContent = c.ko;
            cardEx.textContent = c.ex;
        }

        function render() {
            flashcard.classList.remove("flipped");

            if (mode === "quiz") {
                if (queue.length === 0) {
                    // 퀴즈 완료
                    flashcard.classList.add("hidden");
                    quizControls.classList.add("hidden");
                    countArea.classList.add("hidden");
                    quizMsg.classList.remove("hidden");
                    quizMsg.innerHTML = "🎉 All done!<br><small style='color:#94a3b8;font-size:15px;'>Nice work — switch category or mode to keep going.</small>";
                    return;
                }
                fillCard(cards[queue[0]]);
                counter.textContent = cards.length - queue.length + 1;
                totalEl.textContent = cards.length;
            } else {
                fillCard(cards[idx]);
                counter.textContent = idx + 1;
                totalEl.textContent = cards.length;
            }
        }

        function startQuiz() {
            // 셔플된 대기열 생성
            queue = cards.map((_, i) => i);
            for (let i = queue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [queue[i], queue[j]] = [queue[j], queue[i]];
            }
            flashcard.classList.remove("hidden");
            countArea.classList.remove("hidden");
            quizMsg.classList.add("hidden");
            render();
        }

        // ===== 카테고리 전환 =====
        deckTabs.forEach((tab) => {
            tab.addEventListener("click", () => {
                deckTabs.forEach((t) => t.classList.remove("active"));
                tab.classList.add("active");

                deckKey = tab.dataset.deck;
                cards = decks[deckKey];
                idx = 0;

                if (mode === "quiz") startQuiz();
                else render();
            });
        });

        // ===== 모드 전환 =====
        modeTabs.forEach((tab) => {
            tab.addEventListener("click", () => {
                modeTabs.forEach((t) => t.classList.remove("active"));
                tab.classList.add("active");

                mode = tab.dataset.mode;

                if (mode === "quiz") {
                    studyControls.classList.add("hidden");
                    quizControls.classList.remove("hidden");
                    startQuiz();
                } else {
                    quizControls.classList.add("hidden");
                    studyControls.classList.remove("hidden");
                    quizMsg.classList.add("hidden");
                    flashcard.classList.remove("hidden");
                    countArea.classList.remove("hidden");
                    idx = 0;
                    render();
                }
            });
        });

        // 카드 뒤집기
        flashcard.addEventListener("click", () => {
            flashcard.classList.toggle("flipped");
        });

        // 발음 (단어 / 예문)
        document.getElementById("speakBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            speak(cards[currentCardIndex()].en);
        });
        document.getElementById("speakExBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            // 예문에서 따옴표 제거하고 읽기
            speak(cards[currentCardIndex()].ex.replace(/"/g, ""));
        });

        // Study 컨트롤
        document.getElementById("nextBtn").addEventListener("click", () => {
            idx = (idx + 1) % cards.length;
            render();
        });
        document.getElementById("prevBtn").addEventListener("click", () => {
            idx = (idx - 1 + cards.length) % cards.length;
            render();
        });
        document.getElementById("shuffleBtn").addEventListener("click", () => {
            let n = idx;
            while (n === idx && cards.length > 1) {
                n = Math.floor(Math.random() * cards.length);
            }
            idx = n;
            render();
        });

        // Quiz 컨트롤
        document.getElementById("gotBtn").addEventListener("click", () => {
            queue.shift();            // 맞힌 카드는 제거
            render();
        });
        document.getElementById("reviewBtn").addEventListener("click", () => {
            queue.push(queue.shift()); // 다시 볼 카드는 맨 뒤로
            render();
        });

        render();
    </script>

</body>

</html>
