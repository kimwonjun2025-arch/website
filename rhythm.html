<!DOCTYPE html>
<html>

<head>
    <title>Rhythm Tap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page">

    <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="journey.html">Journey</a>
        <a href="projects.html">Projects</a>
    </nav>

    <div class="game">

        <h1 class="game-title">🥁 Rhythm Tap</h1>
        <p class="game-sub">Hit the notes on the line with &nbsp;D &nbsp;F &nbsp;J &nbsp;K</p>

        <div class="hud">
            <div>SCORE <b id="score">0</b></div>
            <div>COMBO <b id="combo">0</b></div>
            <div>LIVES <b id="lives">❤️❤️❤️</b></div>
            <div>BEST <b id="best">0</b></div>
        </div>

        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>


        <div class="stage" id="stage">

            <!-- 레인 구분선 -->
            <div class="lane-line" style="left:100px;"></div>
            <div class="lane-line" style="left:200px;"></div>
            <div class="lane-line" style="left:300px;"></div>

            <!-- 히트 라인 -->
            <div class="hit-line"></div>

            <!-- 판정 문구 -->
            <div class="judge" id="judge"></div>

            <!-- 레인 키 표시 -->
            <div class="keys">
                <div class="key" data-lane="0">D</div>
                <div class="key" data-lane="1">F</div>
                <div class="key" data-lane="2">J</div>
                <div class="key" data-lane="3">K</div>
            </div>

            <!-- 시작 / 결과 오버레이 -->
            <div class="overlay" id="overlay">
                <h2>🥁 Rhythm Tap</h2>
                <p>Press <b>D F J K</b> when a note reaches the blue line.</p>
                <p>Perfect = 100 · Good = 50</p>
                <button onclick="startGame()">PLAY ▶</button>
            </div>

        </div>


        <a href="index.html">
            <button>HOME</button>
        </a>

    </div>


    <div class="background"></div>


    <script>
        // ===== 설정 =====
        const KEYMAP = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };
        const COLORS = ["#f472b6", "#60a5fa", "#34d399", "#fbbf24"];
        const FREQS  = [110, 150, 210, 300];

        const TRAVEL  = 1700;   // 노트가 위→히트라인까지 오는 시간(ms)
        const HIT_Y   = 464;    // 히트라인에 정확히 맞는 노트 위치
        const START_Y = -30;

        const PERFECT_MS = 65;
        const GOOD_MS    = 145;
        const MISS_MS    = 180;

        const MAX_LIVES  = 5;    // 미스 5번이면 게임 오버

        // ===== 요소 =====
        const stage   = document.getElementById("stage");
        const overlay = document.getElementById("overlay");
        const judgeEl = document.getElementById("judge");
        const scoreEl = document.getElementById("score");
        const comboEl = document.getElementById("combo");
        const livesEl = document.getElementById("lives");
        const bestEl  = document.getElementById("best");
        const progressFill = document.getElementById("progressFill");
        const keyEls  = Array.from(document.querySelectorAll(".key"));

        // ===== 상태 =====
        let beatmap = [];
        let notes   = [];
        let nextIdx = 0;
        let startTime = 0;
        let running = false;
        let rafId = null;

        let score = 0, combo = 0, maxCombo = 0;
        let pPerfect = 0, pGood = 0, pMiss = 0;
        let lives = MAX_LIVES;

        let audioCtx = null;

        // 최고기록 불러오기
        let best = Number(localStorage.getItem("rhythmBest") || 0);
        bestEl.textContent = best;


        // ===== 비트맵 생성 =====
        function buildBeatmap() {
            beatmap = [];
            let t = 2200;
            const steps = [340, 340, 570, 285, 340];

            while (t < 24000) {
                beatmap.push({ time: t, lane: Math.floor(Math.random() * 4) });

                // 가끔 동시에 두 개
                if (Math.random() < 0.12) {
                    beatmap.push({ time: t, lane: Math.floor(Math.random() * 4) });
                }
                t += steps[Math.floor(Math.random() * steps.length)];
            }
        }


        // ===== 게임 시작 =====
        function startGame() {
            // 오디오 준비 (사용자 클릭 후에만 가능)
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }

            buildBeatmap();

            // 남은 노트 정리
            notes.forEach((n) => n.el.remove());
            notes = [];
            nextIdx = 0;

            score = 0; combo = 0; maxCombo = 0;
            pPerfect = 0; pGood = 0; pMiss = 0;
            lives = MAX_LIVES;
            progressFill.style.width = "0%";
            updateHUD();

            overlay.classList.add("hidden");
            running = true;
            startTime = performance.now();

            loop();
        }


        // ===== 메인 루프 =====
        function loop() {
            const songNow = performance.now() - startTime;
            const lastTime = beatmap.length ? beatmap[beatmap.length - 1].time : 0;
            const total = lastTime + 700;

            // 진행 바
            progressFill.style.width =
                Math.min(100, (songNow / total) * 100) + "%";

            // 노트 생성
            while (nextIdx < beatmap.length &&
                   beatmap[nextIdx].time - TRAVEL <= songNow) {
                spawnNote(beatmap[nextIdx]);
                nextIdx++;
            }

            // 노트 위치 갱신 + 놓친 것 처리
            let gameOver = false;
            for (const n of notes) {
                const progress = (songNow - (n.time - TRAVEL)) / TRAVEL;
                const y = START_Y + (HIT_Y - START_Y) * progress;
                n.el.style.transform = `translateY(${y}px)`;

                if (!n.judged && songNow > n.time + MISS_MS) {
                    n.judged = true;
                    n.remove = true;
                    n.el.remove();
                    combo = 0;
                    pMiss++;
                    lives--;
                    showJudge("MISS", "#f87171");
                    updateHUD();

                    if (lives <= 0) gameOver = true;
                }
            }
            notes = notes.filter((n) => !n.remove);

            // 목숨 다 잃으면 즉시 패배
            if (gameOver) {
                endGame(true);
                return;
            }

            // 곡 끝까지 버티면 클리어
            if (nextIdx >= beatmap.length && notes.length === 0 &&
                songNow > lastTime + 700) {
                endGame(false);
                return;
            }

            rafId = requestAnimationFrame(loop);
        }


        function spawnNote(b) {
            const el = document.createElement("div");
            el.className = "note";
            el.style.left = (b.lane * 100 + 8) + "px";
            el.style.background = COLORS[b.lane];
            el.style.transform = `translateY(${START_Y}px)`;
            stage.appendChild(el);

            notes.push({ el, time: b.time, lane: b.lane, judged: false, remove: false });
        }


        // ===== 키 입력 =====
        function hitLane(lane) {
            if (!running) return;

            flashKey(lane);
            playDrum(lane);

            const songNow = performance.now() - startTime;

            // 해당 레인에서 가장 가까운 노트 찾기
            let best = null, bestDt = Infinity;
            for (const n of notes) {
                if (n.lane !== lane || n.judged) continue;
                const dt = Math.abs(n.time - songNow);
                if (dt < bestDt) { bestDt = dt; best = n; }
            }

            if (best && bestDt <= GOOD_MS) {
                best.judged = true;
                best.remove = true;
                best.el.remove();

                if (bestDt <= PERFECT_MS) {
                    score += 100; pPerfect++;
                    showJudge("PERFECT", "#93c5fd");
                } else {
                    score += 50; pGood++;
                    showJudge("GOOD", "#34d399");
                }

                combo++;
                if (combo > maxCombo) maxCombo = combo;
                updateHUD();
            }
            // 빈 타격은 벌점 없음 (소리·불빛만)
        }

        document.addEventListener("keydown", (e) => {
            if (e.repeat) return;
            if (e.code in KEYMAP) {
                e.preventDefault();
                hitLane(KEYMAP[e.code]);
            }
        });

        // 마우스/터치로도 레인 치기
        keyEls.forEach((k) => {
            k.addEventListener("mousedown", () => hitLane(Number(k.dataset.lane)));
        });


        // ===== 피드백 =====
        function flashKey(lane) {
            const k = keyEls[lane];
            k.classList.add("hit");
            setTimeout(() => k.classList.remove("hit"), 90);
        }

        function showJudge(text, color) {
            judgeEl.textContent = text;
            judgeEl.style.color = color;
            judgeEl.classList.remove("flash");
            void judgeEl.offsetWidth;   // 리플로우로 애니메이션 재시작
            judgeEl.classList.add("flash");
        }

        function updateHUD() {
            scoreEl.textContent = score;
            comboEl.textContent = combo;
            livesEl.textContent = lives > 0 ? "❤️".repeat(lives) : "💀";
        }

        // 드럼 사운드 합성
        function playDrum(lane) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;

            const osc  = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = lane === 2 ? "triangle" : "sine";
            osc.frequency.setValueAtTime(FREQS[lane] * 2, now);
            osc.frequency.exponentialRampToValueAtTime(FREQS[lane], now + 0.08);

            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.2);
        }


        // ===== 종료 & 결과 =====
        function endGame(gameOver) {
            running = false;
            if (rafId) cancelAnimationFrame(rafId);

            // 남은 노트 정리
            notes.forEach((n) => n.el.remove());
            notes = [];

            const total = beatmap.length || 1;
            const accuracy = Math.round(((pPerfect + pGood * 0.5) / total) * 100);

            let newRecord = false;
            if (score > best) {
                best = score;
                localStorage.setItem("rhythmBest", best);
                newRecord = true;
            }
            bestEl.textContent = best;

            const heading = gameOver
                ? "💀 Game Over"
                : (newRecord ? "🏆 New Record!" : "🎉 Clear!");

            overlay.innerHTML = `
                <h2>${heading}</h2>
                <p>Score <b>${score}</b></p>
                <p>Accuracy <b>${accuracy}%</b> · Max Combo <b>${maxCombo}</b></p>
                <p style="color:#93c5fd;">Perfect ${pPerfect} · Good ${pGood} · Miss ${pMiss}</p>
                <p style="color:#94a3b8;">Best ${best}</p>
                <button onclick="startGame()">PLAY AGAIN ▶</button>
            `;
            overlay.classList.remove("hidden");
        }
    </script>

</body>

</html>
